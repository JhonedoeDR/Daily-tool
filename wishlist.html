<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ウィッシュリスト</title>
<link rel="stylesheet" href="./style.css" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<meta name="theme-color" content="#faf8f3" />
<style>
.wl-tabs { display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; -webkit-overflow-scrolling:touch; }
.wl-tab { flex:0 0 auto; padding:5px 12px; font-size:13px; border:1px solid var(--paper-line); border-radius:999px; background:none; color:var(--text-soft); }
.wl-tab.active { background:#333; color:#fff; border-color:#333; }
.wl-group-title { font-size:12px; color:var(--text-soft); margin:10px 0 2px; }
.wl-row { padding:6px 0; border-bottom:1px solid var(--paper-line); }
.wl-row-main { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; }
.wl-row-sub { font-size:11px; color:var(--text-soft); margin:1px 0 4px; }
.wl-row-actions { display:flex; gap:6px; align-items:center; }
.wl-row-actions select { font-size:12px; padding:2px 4px; }
.wl-badge { border:1px solid var(--paper-line); border-radius:4px; padding:0 4px; margin-right:4px; }
</style>
</head>
<body>
<div class="lm-page">
  <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
  <h1 class="lm-date-header">ウィッシュリスト</h1>

  <div id="tabs" class="wl-tabs"></div>
  <div id="totals" class="lm-shift-box"></div>
  <div id="list"></div>
  <div id="add-area" style="margin:12px 0;"></div>

  <section class="lm-section" id="form-section" hidden>
    <div class="lm-section-title" id="form-title">追加する</div>
    <form id="item-form">
      <div class="lm-field">
        <label for="f-name">名前</label>
        <input id="f-name" required />
      </div>
      <div class="lm-field">
        <label for="f-price">価格(円)</label>
        <input id="f-price" type="number" inputmode="numeric" pattern="[0-9]*" min="0" />
      </div>
      <div class="lm-field">
        <label for="f-url">URL</label>
        <input id="f-url" type="url" />
      </div>
      <div class="lm-field" style="flex-direction:row; align-items:center; gap:8px;">
        <input id="f-plan" type="checkbox" style="width:18px; height:18px;" />
        <label for="f-plan" style="margin:0;">今月買う予定</label>
      </div>
      <div class="lm-field">
        <label for="f-memo">メモ</label>
        <textarea id="f-memo" rows="2"></textarea>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="submit" class="lm-btn">保存</button>
        <button type="button" id="cancel-edit" class="lm-btn secondary">キャンセル</button>
      </div>
    </form>
  </section>

  <div id="nav-container"></div>
</div>
<script src="./app.js"></script>
<script src="./wishlist.js"></script>
</body>
</html>
