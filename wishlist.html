<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ウィッシュリスト</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#faf8f3" />
</head>

<body>
<div class="lm-page">
  <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
  <h1 class="lm-date-header">ウィッシュリスト</h1>

  <div id="tabs" class="wl-tabs"></div>
  <div id="filters"></div>
  <div id="totals" class="lm-shift-box"></div>
  <div id="list"></div>
  <div id="add-area" class="wl-add-area"></div>

  <section class="lm-section" id="form-section" hidden>
    <div class="lm-section-title" id="form-title">追加する</div>

    <form id="item-form">
      <div class="lm-field">
        <label for="f-name">名前</label>
        <input id="f-name" required />
      </div>

      <div class="lm-field">
        <label for="f-price">価格(円)</label>
        <input id="f-price" type="number" inputmode="numeric" pattern="[0-9]*" min="0" />
      </div>

      <div class="lm-field">
        <label for="f-status">属性</label>
        <select id="f-status"></select>
      </div>

      <div class="lm-field">
        <label for="f-url">URL</label>
        <input id="f-url" type="url" />
      </div>

      <div class="lm-field wl-plan-field">
        <input id="f-plan" type="checkbox" />
        <label for="f-plan">今月買う予定</label>
      </div>

      <div class="lm-field">
        <label for="f-memo">メモ</label>
        <textarea id="f-memo" rows="2"></textarea>
      </div>

      <div class="wl-form-buttons">
        <button type="submit" class="lm-btn">保存</button>
        <button type="button" id="cancel-edit" class="lm-btn secondary">キャンセル</button>
      </div>
    </form>
  </section>

  <div id="nav-container"></div>
</div>

<script src="./app.js"></script>
<script src="./renderNav-menu.js"></script>
<script src="./wishlist.js"></script>
</body>
</html>
