<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ゲーム管理</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#ffffff" />
</head>

<body>
  <main class="lm-page lm-games-page">
    <h1 class="lm-date-header">ゲーム</h1>
    <p class="lm-sub-header">ログイン・石・攻略メモをゲームごとに管理します。</p>

    <section class="lm-game-slider" aria-label="ゲーム情報スライダー">
      <div class="lm-game-slides">
        <section class="lm-game-slide is-active" data-slide="calendar" aria-label="ログイン・目標カレンダー">
          <div class="lm-game-slide-heading"><h2>カレンダー</h2><div class="lm-game-calendar-controls"><button type="button" id="game-calendar-prev" aria-label="前の月">‹</button><span id="game-calendar-title"></span><button type="button" id="game-calendar-next" aria-label="次の月">›</button></div></div>
          <div id="game-calendar-grid" class="hs-calendar-grid" aria-label="月間カレンダー"></div>
          <div class="hs-calendar-controls sc-calendar-controls"><button type="button" class="lm-btn secondary" id="game-calendar-today">今日</button></div>
          <div class="lm-game-calendar-legend"><span><i class="login-dot"></i>ログイン</span><span><i class="goal-dot"></i>石の目標期日</span></div>
          <p id="game-calendar-selected" class="lm-game-calendar-selected">日付を選ぶと、その日の記録を確認できます。</p>
        </section>
        <section class="lm-game-slide" data-slide="notes" aria-label="最近の攻略メモ">
          <div class="lm-game-slide-heading"><h2>攻略メモ</h2><button type="button" class="lm-game-slide-link" data-open-tab="notes">すべて見る ›</button></div>
          <div id="game-sticky-board" class="lm-game-sticky-board"><p class="lm-empty">攻略メモはまだありません。</p></div>
        </section>
      </div>
      <div class="lm-game-slider-controls"><button type="button" id="game-slide-prev" aria-label="前のスライド">‹</button><div class="lm-game-slide-dots"><button type="button" data-slide-to="0" aria-label="カレンダーを表示" class="is-active"></button><button type="button" data-slide-to="1" aria-label="攻略メモを表示"></button></div><button type="button" id="game-slide-next" aria-label="次のスライド">›</button></div>
    </section>

    <nav class="lm-game-tabs" aria-label="ゲーム機能">
      <button type="button" class="is-active" data-tab="register"><span aria-hidden="true">＋</span><span>ゲーム登録</span></button>
      <button type="button" data-tab="login"><span aria-hidden="true">✓</span><span>ログイン管理</span></button>
      <button type="button" data-tab="stones"><span aria-hidden="true">◇</span><span>石管理</span></button>
      <button type="button" data-tab="notes"><span aria-hidden="true">▤</span><span>攻略メモ</span></button>
    </nav>

    <div class="lm-game-current-picker" id="game-current-picker" hidden>
      <label for="game-current-select">管理するゲーム</label>
      <select id="game-current-select"><option value="">ゲームを選択</option></select>
    </div>

    <section class="lm-game-panel is-active" data-panel="register">
      <div class="lm-section lm-games-add-section">
        <div class="lm-section-title">ゲームを登録</div>
        <form id="game-form" class="lm-game-form">
          <label>ゲーム名<input id="game-name" required maxlength="80" placeholder="例：ゲームの名前" /></label>
          <label class="lm-game-file-field"><span>アイコン画像（任意）</span><span class="lm-game-file-control"><span id="game-icon-file-name">画像を選ぶ</span><span class="lm-game-file-button">ファイルを選択</span><input id="game-icon" type="file" accept="image/*" /></span></label>
          <fieldset class="lm-game-quick-config"><legend>石管理で使う追加ボタン</legend><p class="lm-game-status">よく使う入手数を登録できます。初期値は＋300、＋1000です。</p><div id="game-quick-values" class="lm-game-quick-values"></div><div class="lm-game-quick-add"><input id="game-quick-amount" type="number" min="1" step="1" inputmode="numeric" placeholder="追加する数（例：500）" aria-label="追加する石の数"><button type="button" class="lm-btn secondary" id="game-quick-add-button">追加</button></div></fieldset>
          <button class="lm-btn" type="submit">ゲームを追加</button>
        </form>
      </div>
      <div class="lm-section"><div class="lm-section-title">登録済みのゲーム</div><div id="games-list" class="lm-games-list"><p class="lm-empty">読み込み中…</p></div></div>
    </section>

    <section class="lm-game-panel" data-panel="login" hidden>
      <div class="lm-section"><div class="lm-section-title">ログイン管理</div><div id="game-login-content"><p class="lm-empty">ゲームを登録してください。</p></div></div>
    </section>

    <section class="lm-game-panel" data-panel="stones" hidden>
      <div class="lm-section"><div class="lm-section-title">石管理</div><div id="game-stones-content"><p class="lm-empty">ゲームを登録してください。</p></div></div>
    </section>

    <section class="lm-game-panel" data-panel="notes" hidden>
      <div class="lm-section"><div class="lm-section-title">攻略メモ</div><div id="game-notes-content"><p class="lm-empty">ゲームを登録してください。</p></div></div>
    </section>
    <div id="nav-container"></div>
  </main>
  <script src="./app.js"></script>
  <script src="./renderNav-menu.js"></script>
  <script src="./games-db.js"></script>
  <script type="module" src="./firebase-sync.js"></script>
  <script src="./games.js"></script>
</body>
</html>
