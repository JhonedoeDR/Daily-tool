<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>履修・シフト</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#faf8f3" />
</head>
<body>
  <div class="lm-page hs-page">
    <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
    <header class="hs-page-toolbar">
      <h1 class="lm-date-header">履修・シフト</h1>
      <div class="hs-calendar-controls">
        <button type="button" class="lm-btn secondary" id="today-button">今日</button>
        <button type="button" class="lm-btn secondary" id="calendar-toggle" aria-pressed="false">カレンダー</button>
      </div>
    </header>

    <section class="lm-section hs-agenda" style="border-top:none;">
      <div class="hs-calendar-nav">
        <button type="button" class="lm-btn secondary" id="calendar-prev" aria-label="前の月">‹</button>
        <strong id="calendar-title"></strong>
        <button type="button" class="lm-btn secondary" id="calendar-next" aria-label="次の月">›</button>
      </div>
      <div class="hs-date-strip" id="date-strip" aria-label="日付を選択"></div>
      <div class="hs-calendar-grid" id="calendar-grid" aria-label="月間カレンダー" hidden></div>
      <div class="hs-day-heading" id="selected-date-label"></div>
      <div class="hs-class-filters">
        <label for="class-subject-filter">科目</label>
        <select id="class-subject-filter">
          <option value="">すべて</option>
        </select>
        <label for="class-section-filter">区分</label>
        <select id="class-section-filter" disabled>
          <option value="">すべて</option>
        </select>
      </div>
      <details class="hs-add-details" id="add-plan-details">
        <summary class="lm-btn">＋ 予定を追加</summary>
        <form id="add-plan-form" class="hs-inline-form">
          <div class="lm-field">
            <span class="hs-field-label">予定テンプレート</span>
            <input id="add-template" type="hidden" />
            <div id="add-template-chips" class="hs-template-chips" role="group" aria-label="予定テンプレート"></div>
          </div>
          <div class="lm-field hs-class-exam-fields" id="class-entry-type-field" hidden>
            <label for="class-entry-type">登録する内容</label>
            <select id="class-entry-type">
              <option value="class">通常授業</option>
              <option value="exam">試験</option>
            </select>
          </div>
          <div class="lm-field hs-class-period-field" id="class-period-field" hidden>
            <label>授業時限（複数選択可）</label>
            <div id="class-period-options" class="hs-period-options"></div>
            <small id="class-period-help">日付を選択すると、その曜日の時限が表示されます。</small>
          </div>
          <div class="lm-field hs-manual-time-field" id="manual-time-field">
            <label>時間(任意)</label>
            <div class="hs-time-range">
              <input id="add-start-time" type="time" aria-label="開始時刻" />
              <span>〜</span>
              <input id="add-end-time" type="time" aria-label="終了時刻" />
            </div>
          </div>
          <div class="lm-field">
            <label for="add-location">場所(任意)</label>
            <input id="add-location" type="text" maxlength="80" />
          </div>
          <div class="lm-field hs-add-shift-only" hidden>
            <label for="add-break">休憩時間(分)</label>
            <input id="add-break" type="number" inputmode="numeric" min="0" value="0" />
          </div>
          <div id="add-preview" class="lm-empty"></div>
          <p class="hs-add-instruction" id="add-instruction">テンプレートを選んだあと、登録したい日付をタップしてください。</p>
          <button type="button" class="lm-btn" id="place-selected-date" disabled>この日付に登録</button>
          <button type="button" class="lm-btn secondary" id="cancel-add-mode">登録モードを終了</button>
        </form>
      </details>
      <div class="hs-add-undo" id="add-undo" hidden></div>
      <div id="day-list"></div>
    </section>

    <section class="lm-section">
      <div class="hs-section-heading">
        <div class="lm-section-title">予定テンプレート</div>
        <button type="button" class="lm-btn secondary" id="template-toggle" aria-expanded="false">予定を登録</button>
      </div>
      <form id="template-form" class="hs-template-form" hidden>
        <div class="lm-field">
          <label for="template-kind">種類</label>
          <select id="template-kind">
            <option value="class">授業・履修</option>
            <option value="shift">アルバイトのシフト</option>
          </select>
        </div>
        <div class="lm-field">
          <label for="template-name">予定の名前</label>
          <input id="template-name" type="text" maxlength="60" required placeholder="例: 情報処理 / カフェ" />
        </div>
        <div class="lm-field hs-template-class-only" id="template-class-fields">
          <label for="template-unit-capacity">区分ごとの最大授業数</label>
          <input id="template-unit-capacity" type="number" inputmode="numeric" min="1" placeholder="例: 3" required />
          <small>前期(4〜8月)は区分1〜8、後期(9〜2月)は区分9〜16に割り当てます。</small>
        </div>
        <div class="lm-field hs-template-class-only" id="template-attendance-fields">
          <label for="template-attendance-required">必要出席日数（限数）</label>
          <input id="template-attendance-required" type="number" inputmode="numeric" min="1" placeholder="例: 12" required />
          <small>同じ日に複数限ある場合も、1限ごとに出席を記録します。</small>
        </div>
        <fieldset class="lm-field hs-template-class-only hs-skipped-sections" id="template-skipped-sections">
          <legend id="template-skip-section-legend"></legend>
          <div class="hs-skip-section-list" id="template-skip-section-list"></div>
        </fieldset>
        <fieldset class="lm-field hs-template-belongings">
          <legend>持ちものセット(任意・複数選択可)</legend>
          <div id="template-belonging-list" class="lm-check-list"></div>
        </fieldset>
        <div class="hs-template-form-actions">
          <button type="button" class="lm-btn secondary" id="template-cancel" hidden>キャンセル</button>
          <button type="submit" class="lm-btn" id="template-save">テンプレートを保存</button>
        </div>
      </form>
      <div id="template-list"></div>
      <div id="template-pager" class="lm-pager" hidden></div>
      <button type="button" class="lm-btn secondary hs-template-list-all" id="template-list-all" hidden>一覧表示</button>
    </section>

    <section class="lm-section">
      <div class="lm-section-title">
        今月の給与見込み
        <span class="lm-count" id="month-label"></span>
      </div>
      <div id="month-summary" class="lm-shift-box"></div>
    </section>

    <section class="lm-section">
      <div class="lm-section-title">給与設定</div>
      <div class="lm-field">
        <label for="f-wage">時給(円)</label>
        <input id="f-wage" type="number" inputmode="numeric" pattern="[0-9]*" min="0" />
      </div>
      <div class="lm-field">
        <label for="f-transport">交通費(1勤務あたり・円)</label>
        <input id="f-transport" type="number" inputmode="numeric" pattern="[0-9]*" min="0" />
      </div>
    </section>

    <div id="nav-container"></div>
  </div>

  <script src="./app.js"></script>
  <script src="./renderNav-menu.js"></script>
  <script type="module" src="./firebase-sync.js"></script>
  <script src="./shift.js"></script>
</body>
</html>
