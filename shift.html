<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>履修・シフト</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#faf8f3" />
</head>
<body>
  <div class="lm-page hs-page">
    <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
    <header class="hs-page-toolbar">
      <h1 class="lm-date-header">履修・シフト</h1>
      <div class="hs-calendar-controls">
        <button type="button" class="lm-btn secondary" id="today-button">今日</button>
        <button type="button" class="lm-btn secondary" id="calendar-toggle" aria-pressed="false">カレンダー</button>
      </div>
    </header>

    <section class="lm-section hs-agenda" style="border-top:none;">
      <div class="hs-calendar-nav">
        <button type="button" class="lm-btn secondary" id="calendar-prev" aria-label="前の月">‹</button>
        <strong id="calendar-title"></strong>
        <button type="button" class="lm-btn secondary" id="calendar-next" aria-label="次の月">›</button>
      </div>
      <div class="hs-date-strip" id="date-strip" aria-label="日付を選択"></div>
      <div class="hs-calendar-grid" id="calendar-grid" aria-label="月間カレンダー" hidden></div>
      <div class="hs-day-heading" id="selected-date-label"></div>
      <details class="hs-add-details" id="add-plan-details">
        <summary class="lm-btn">＋ 予定を追加</summary>
        <form id="add-plan-form" class="hs-inline-form">
          <div class="lm-field">
            <span class="hs-field-label">予定テンプレート</span>
            <input id="add-template" type="hidden" />
            <div id="add-template-chips" class="hs-template-chips" role="group" aria-label="予定テンプレート"></div>
          </div>
          <div class="lm-field">
            <label for="add-repeat">追加方法</label>
            <select id="add-repeat">
              <option value="once">選択日のみ</option>
              <option value="weekly">毎週くり返す</option>
            </select>
          </div>
          <div class="lm-field">
            <label for="add-start-date">開始日</label>
            <input id="add-start-date" type="date" required />
          </div>
          <div class="lm-field hs-once-fields">
            <label>時間(任意)</label>
            <div class="hs-time-range">
              <input id="add-start-time" type="time" aria-label="開始時刻" />
              <span>〜</span>
              <input id="add-end-time" type="time" aria-label="終了時刻" />
            </div>
          </div>
          <fieldset class="lm-field hs-repeat-fields" id="add-weekdays" hidden>
            <legend>曜日と時間(時間は任意)</legend>
            <div class="hs-weekday-schedule">
              <label><input type="checkbox" name="add-weekday" value="0" /><span>日</span><input type="time" data-weekday-start="0" aria-label="日曜日の開始時刻" disabled /><span>〜</span><input type="time" data-weekday-end="0" aria-label="日曜日の終了時刻" disabled /></label>
              <label><input type="checkbox" name="add-weekday" value="1" /><span>月</span><input type="time" data-weekday-start="1" aria-label="月曜日の開始時刻" disabled /><span>〜</span><input type="time" data-weekday-end="1" aria-label="月曜日の終了時刻" disabled /></label>
              <label><input type="checkbox" name="add-weekday" value="2" /><span>火</span><input type="time" data-weekday-start="2" aria-label="火曜日の開始時刻" disabled /><span>〜</span><input type="time" data-weekday-end="2" aria-label="火曜日の終了時刻" disabled /></label>
              <label><input type="checkbox" name="add-weekday" value="3" /><span>水</span><input type="time" data-weekday-start="3" aria-label="水曜日の開始時刻" disabled /><span>〜</span><input type="time" data-weekday-end="3" aria-label="水曜日の終了時刻" disabled /></label>
              <label><input type="checkbox" name="add-weekday" value="4" /><span>木</span><input type="time" data-weekday-start="4" aria-label="木曜日の開始時刻" disabled /><span>〜</span><input type="time" data-weekday-end="4" aria-label="木曜日の終了時刻" disabled /></label>
              <label><input type="checkbox" name="add-weekday" value="5" /><span>金</span><input type="time" data-weekday-start="5" aria-label="金曜日の開始時刻" disabled /><span>〜</span><input type="time" data-weekday-end="5" aria-label="金曜日の終了時刻" disabled /></label>
              <label><input type="checkbox" name="add-weekday" value="6" /><span>土</span><input type="time" data-weekday-start="6" aria-label="土曜日の開始時刻" disabled /><span>〜</span><input type="time" data-weekday-end="6" aria-label="土曜日の終了時刻" disabled /></label>
            </div>
          </fieldset>
          <div class="lm-field hs-repeat-fields" hidden>
            <label for="add-until-date">くり返し終了日</label>
            <input id="add-until-date" type="date" />
          </div>
          <div class="lm-field">
            <label for="add-location">場所(任意)</label>
            <input id="add-location" type="text" maxlength="80" />
          </div>
          <div class="lm-field hs-add-shift-only" hidden>
            <label for="add-break">休憩時間(分)</label>
            <input id="add-break" type="number" inputmode="numeric" min="0" value="0" />
          </div>
          <div id="add-preview" class="lm-empty"></div>
          <button type="submit" class="lm-btn">カレンダーに追加</button>
        </form>
      </details>
      <div id="day-list"></div>
    </section>

    <section class="lm-section">
      <div class="hs-section-heading">
        <div class="lm-section-title">予定テンプレート</div>
        <button type="button" class="lm-btn secondary" id="template-toggle" aria-expanded="false">予定を登録</button>
      </div>
      <div id="template-list"></div>
      <div id="template-pager" class="lm-pager" hidden></div>
      <button type="button" class="lm-btn secondary hs-template-list-all" id="template-list-all" hidden>一覧表示</button>
      <form id="template-form" class="hs-template-form" hidden>
        <div class="lm-field">
          <label for="template-kind">種類</label>
          <select id="template-kind">
            <option value="class">授業・履修</option>
            <option value="shift">アルバイトのシフト</option>
          </select>
        </div>
        <div class="lm-field">
          <label for="template-name">予定の名前</label>
          <input id="template-name" type="text" maxlength="60" required placeholder="例: 情報処理 / カフェ" />
        </div>
        <button type="submit" class="lm-btn">テンプレートを保存</button>
      </form>
    </section>

    <section class="lm-section">
      <div class="lm-section-title">
        今月の給与見込み
        <span class="lm-count" id="month-label"></span>
      </div>
      <div id="month-summary" class="lm-shift-box"></div>
    </section>

    <section class="lm-section">
      <div class="lm-section-title">給与設定</div>
      <div class="lm-field">
        <label for="f-wage">時給(円)</label>
        <input id="f-wage" type="number" inputmode="numeric" pattern="[0-9]*" min="0" />
      </div>
      <div class="lm-field">
        <label for="f-transport">交通費(1勤務あたり・円)</label>
        <input id="f-transport" type="number" inputmode="numeric" pattern="[0-9]*" min="0" />
      </div>
    </section>

    <div id="nav-container"></div>
  </div>

  <script src="./app.js"></script>
  <script src="./renderNav-menu.js"></script>
  <script src="./shift.js"></script>
</body>
</html>
