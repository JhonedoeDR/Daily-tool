<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>持ちもの</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#faf8f3" />
</head>
<body>
  <div class="lm-page">
    <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
    <h1 class="lm-date-header">持ちもの</h1>
    <p class="lm-sub-header">用途ごとにセットを作り、予定に紐付けて使います</p>

    <section class="lm-section" style="border-top:none;">
      <div class="lm-section-title">新しいセットを作る</div>
      <form id="set-form" style="display:flex; gap:8px;">
        <input id="f-set-name" placeholder="セット名(例:バイト)" style="flex:1; min-width:0; font-family:var(--font-body); font-size:16px; padding:10px 12px; border:1px solid var(--paper-line); border-radius:8px;" required />
        <button type="submit" class="lm-btn">追加</button>
      </form>
    </section>

    <section class="lm-section">
      <div class="lm-section-title">セット一覧</div>
      <div id="set-list"></div>
    </section>

    <div id="nav-container"></div>
  </div>

  <script src="./app.js"></script>
  <script src="./belongings.js"></script>
</body>
</html>
