<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>今日のページ</title>
<link rel="stylesheet" href="./style.css" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<meta name="theme-color" content="#ffffff" />
</head>
<body>

<div class="lm-page hm-page">

  <!-- 上部:大きな円(STEP 1は見た目と切り替えのみ。中身の接続はSTEP 2以降) -->
  <section class="hm-hero" id="hm-hero" aria-label="表示の切り替え">
    <div class="hm-mode-title" id="hm-mode-title" aria-live="polite"></div>
    <div class="hm-stage">
      <button type="button" class="hm-arrow" id="hm-prev" aria-label="前の機能">‹</button>
      <div class="hm-circle" id="hm-circle">
        <svg class="hm-ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="band" cx="100" cy="100" r="76" />
          <g id="hm-ring-dyn"></g>
          <circle class="outer" cx="100" cy="100" r="96" />
          <circle class="disc" cx="100" cy="100" r="56" />
        </svg>
        <div class="hm-inner" id="hm-inner"></div>
      </div>
      <button type="button" class="hm-arrow" id="hm-next" aria-label="次の機能">›</button>
    </div>
    <div class="hm-caption" id="hm-caption"></div>
    <div class="hm-dots" id="hm-dots"></div>
  </section>

  <div id="notify-banner"></div>

  <!-- 中段 -->
  <div class="hm-grid">
    <div class="hm-col" id="hm-col-left">
      <div class="hm-dog-area">
        <div class="hm-bubble">ワンワン!<br />(今日のタスクだワン!)</div>
        <svg class="hm-dog" viewBox="0 0 140 100" role="img" aria-label="犬(仮のイラスト)">
          <path class="ear" d="M38 34C18 30 12 56 22 66C32 60 38 48 38 34Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
          <path class="ear" d="M102 34C122 30 128 56 118 66C108 60 102 48 102 34Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
          <ellipse class="face" cx="70" cy="56" rx="38" ry="34" stroke="currentColor" stroke-width="2.5" />
          <circle cx="56" cy="52" r="3.6" fill="currentColor" />
          <circle cx="84" cy="52" r="3.6" fill="currentColor" />
          <ellipse cx="70" cy="63" rx="6" ry="4.5" fill="currentColor" />
          <path d="M70 67.5V72M70 72Q63 78 57 73M70 72Q77 78 83 73" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <path class="tongue" d="M65 76Q70 90 75 76Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          <ellipse class="paw" cx="44" cy="94" rx="13" ry="8" stroke="currentColor" stroke-width="2.5" />
          <ellipse class="paw" cx="96" cy="94" rx="13" ry="8" stroke="currentColor" stroke-width="2.5" />
        </svg>
      </div>

      <section class="lm-section" data-section="task">
        <div class="lm-section-title">メイン</div>
        <div id="tasks-list"></div>
      </section>
    </div>

    <div class="hm-col" id="hm-col-right">
      <section class="lm-section" data-section="schedule">
        <div class="lm-section-title">予定</div>
        <div id="schedule-list"></div>
      </section>

      <section class="lm-section" data-section="event">
        <div class="lm-section-title">イベント</div>
        <div id="events-list"></div>
      </section>

      <section class="lm-section" data-section="belongings">
        <div class="lm-section-title">
          持ちもの
          <span class="lm-count" id="belongings-count"></span>
        </div>
        <div id="belongings-list" class="lm-card-grid"></div>
      </section>

      <section class="lm-section" data-section="shift">
        <div class="lm-section-title">勤務</div>
        <div id="shift-box"></div>
      </section>
    </div>
  </div>

  <div id="nav-container"></div>

  <section class="lm-section" style="margin-top:16px;">
    <div class="lm-section-title">データのバックアップ</div>
    <p class="lm-empty" style="margin-bottom:10px;">端末側の事情でデータが消えることがあるため、時々バックアップの保存をおすすめします</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" id="export-btn" class="lm-btn secondary">バックアップを保存</button>
      <label class="lm-btn secondary" style="cursor:pointer;">
        バックアップから復元
        <input type="file" id="import-input" accept="application/json" style="display:none;" />
      </label>
    </div>
  </section>

</div>

<!-- 下部固定メニュー -->
<nav class="hm-nav" aria-label="メインメニュー">
  <span class="hm-hump" aria-hidden="true"></span>

  <a class="hm-nav-item" href="./schedule.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3.5v3M15 3.5v3"/></svg>
    <span>予定逆算</span>
  </a>

  <a class="hm-nav-item" href="./todo.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
    <span>タスク</span>
  </a>

  <button type="button" class="hm-home" id="hm-home" aria-label="HOME" aria-current="page">
    <span class="hm-home-disc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l-8 8h4.5v7.5h7V12H20z"/></svg>
    </span>
    <span>HOME</span>
  </button>

  <a class="hm-nav-item" href="./time-calc.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    <span>時間計算</span>
  </a>

  <a class="hm-nav-item" href="./event.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4M6 5h11l-2.5 3.5L17 12H6"/></svg>
    <span>イベント</span>
  </a>
</nav>

<script src="./app.js"></script>
<script src="./renderNav-menu.js"></script>
<script type="module" src="./firebase-sync.js"></script>
<script src="./home.js"></script>
</body>
</html>
