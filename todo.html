<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>タスク</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#faf8f3" />
</head>
<body>
  <div class="lm-page">
    <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
      <h1 class="lm-date-header">タスク</h1>
      <button type="button" id="daily-reset-btn" class="lm-btn secondary" style="font-size:12px; padding:6px 12px; white-space:nowrap;">デイリーリセット</button>
    </div>
    <p class="lm-sub-header">毎日AM4:00に自動でリセットされます</p>

    <section class="lm-section" style="border-top:none;">
      <div class="lm-section-title">週間達成のごほうび</div>
      <input id="f-reward" placeholder="100%達成した時のご褒美を入力" style="width:100%; font-family:var(--font-body); font-size:16px; padding:10px 12px; border:1px solid var(--paper-line); border-radius:8px; background:#fff; color:var(--text);" />
      <p class="lm-empty" style="margin-top:6px;">毎週月曜AM4:00にリセットされます</p>
    </section>

    <section class="lm-section" style="border-top:none;">
      <div id="todo-groups"></div>
    </section>

    <section class="lm-section">
      <div class="lm-section-title">今週のメインタスククリア</div>
      <p class="lm-empty" style="margin-bottom:10px;">メインタスクをクリアするたび、次のマスが埋まります</p>
      <div id="weekly-grid" class="lm-week-grid"></div>
      <div id="weekly-count" style="margin-top:8px; font-size:13px; color:var(--text-soft);"></div>
      <div id="reward-box" style="display:none; margin-top:10px; padding:10px 12px; background:var(--accent-soft); border-radius:8px; font-size:13px;">
        <div style="font-weight:500;">今週のメインタスクを14回クリアしました</div>
        <div style="color:var(--text-soft); margin-top:2px;">ご褒美を受け取れます</div>
      </div>
    </section>

    <div id="nav-container"></div>
  </div>

  <script src="./app.js"></script>
  <script src="./renderNav-menu.js"></script>
  <script src="./todo.js"></script>
</body>
</html>
