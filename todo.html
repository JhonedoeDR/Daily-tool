<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>タスク</title>
<link rel="stylesheet" href="./style.css" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./image/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./image/icon-192.png" />
<meta name="theme-color" content="#faf8f3" />
</head>
<body>

<div class="lm-page todo-page">
  <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>

  <h1 class="lm-date-header">タスク</h1>
  <p class="lm-sub-header">開始日前のタスクは開始日になるまでグレーで表示されます。期限終了後1週間はストレージで確認できます。</p>

  <div class="todo-progress-accordions" aria-label="達成状況">
    <details class="todo-progress-accordion">
      <summary>今週のメインタスククリア</summary>
      <div class="todo-progress-content">
        <div class="lm-reward-row">
          <span class="lm-reward-label">ごほうび：</span>
          <input id="f-reward" class="lm-reward-input" type="text" placeholder="ここにご褒美を入力" />
        </div>
        <div id="weekly-grid" class="lm-week-grid"></div>
        <div id="weekly-count" class="todo-progress-count"></div>
        <div id="reward-box" class="todo-reward-box" style="display:none;">
          <div style="font-weight:500;">今週のメインタスクを14回クリアしました</div>
          <div class="todo-reward-caption">ご褒美を受け取れます</div>
        </div>
      </div>
    </details>
    <details class="todo-progress-accordion">
      <summary>今月のルーティンクリア</summary>
      <div class="todo-progress-content">
        <div class="lm-reward-row">
          <span class="lm-reward-label">ごほうび：</span>
          <input id="f-routine-reward" class="lm-reward-input" type="text" placeholder="ここにご褒美を入力" />
        </div>
        <div id="routine-progress" class="lm-event"></div>
        <div id="routine-reward-box" class="todo-reward-box" style="display:none;">
          <div id="routine-reward-title" style="font-weight:500;"></div>
          <div class="todo-reward-caption">ご褒美を受け取れます</div>
        </div>
      </div>
    </details>
  </div>

  <section class="lm-section todo-main-section">
    <div class="todo-manager">
      <div class="todo-toolbar">
        <button type="button" id="todo-new-task" class="lm-btn todo-new-task">＋ 新規作成</button>
        <div class="todo-sort-row">
          <label>ソート
            <select id="todo-sort">
              <option value="name">名前順</option>
              <option value="deadline">期限順</option>
            </select>
          </label>
          <div class="todo-sort-actions" aria-label="表示設定">
            <button type="button" id="todo-filter-toggle" class="todo-icon-button" aria-label="フィルターを表示" aria-controls="todo-filter-panel" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.1v5.1l-3.6 1.8v-6.9L4 5Z" /></svg>
            </button>
            <button type="button" id="todo-sort-direction" class="todo-icon-button" aria-label="昇順" aria-pressed="false" title="昇順">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
            </button>
            <button type="button" id="todo-archive-toggle" class="todo-icon-button" aria-label="ストレージを表示" aria-pressed="false" title="ストレージ">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18m-15 0 1 14h10l1-14M9 6V4h6v2m-5 4v7m4-7v7" /></svg>
            </button>
          </div>
        </div>
        <div class="todo-filter-row" id="todo-filter-panel" hidden>
          <fieldset class="todo-filter-group">
            <legend>タブ</legend>
            <label><input type="checkbox" name="todo-category-filter" value="main" checked /> メイン</label>
            <label><input type="checkbox" name="todo-category-filter" value="routine" checked /> ルーティン</label>
            <label><input type="checkbox" name="todo-category-filter" value="other" checked /> その他</label>
          </fieldset>
          <fieldset class="todo-filter-group">
            <legend>期限</legend>
            <label><input type="radio" name="todo-deadline-filter" value="all" checked /> すべて</label>
            <label><input type="radio" name="todo-deadline-filter" value="yes" /> あり</label>
            <label><input type="radio" name="todo-deadline-filter" value="no" /> なし</label>
          </fieldset>
        </div>
      </div>
      <h2 id="todo-list-mode" class="todo-list-mode">タスク一覧</h2>
      <div class="todo-pager" aria-label="タスク一覧ページ">
        <button type="button" id="todo-page-prev" class="todo-page-button" data-page-delta="-1" aria-label="前のページ">前へ</button>
        <span id="todo-page-status" aria-live="polite"></span>
        <button type="button" id="todo-page-next" class="todo-page-button" data-page-delta="1" aria-label="次のページ">次へ</button>
      </div>
      <div id="todo-task-list" class="todo-task-list" aria-live="polite"></div>
      <div id="todo-bulk-actions" class="todo-bulk-actions" hidden>
        <span id="todo-selection-count"></span>
        <button type="button" id="todo-bulk-delete" class="lm-btn secondary">選択したタスクを削除</button>
      </div>
      <div class="todo-pager" aria-label="タスク一覧ページ">
        <button type="button" class="todo-page-button" data-page-delta="-1" aria-label="前のページ">前へ</button>
        <span class="todo-page-status-copy" aria-hidden="true"></span>
        <button type="button" class="todo-page-button" data-page-delta="1" aria-label="次のページ">次へ</button>
      </div>
      <dialog id="todo-create-dialog" class="todo-create-dialog" aria-labelledby="todo-form-heading">
        <div class="todo-create-tabs" role="tablist" aria-label="タスクの種類">
          <button type="button" id="todo-tab-main" role="tab" aria-controls="todo-create-form" aria-selected="true" class="todo-create-tab is-active" data-create-tab="main">メイン</button>
          <button type="button" id="todo-tab-routine" role="tab" aria-controls="todo-create-form" aria-selected="false" class="todo-create-tab" data-create-tab="routine">ルーティン</button>
          <button type="button" id="todo-tab-other" role="tab" aria-controls="todo-create-form" aria-selected="false" class="todo-create-tab" data-create-tab="other">その他</button>
        </div>
        <form id="todo-create-form" class="todo-create-form" role="tabpanel" aria-labelledby="todo-tab-main">
        <input type="hidden" id="todo-edit-id" />
        <div class="todo-form-heading" id="todo-form-heading">メインタスクを追加</div>
        <label class="todo-field">タスク名
          <input id="todo-task-name" type="text" maxlength="200" required placeholder="タスク名を入力" />
        </label>
        <div class="todo-date-fields" id="todo-date-fields">
          <label class="todo-field" id="todo-start-date-label">開始日（任意）
            <input id="todo-start-date" type="date" />
          </label>
          <label class="todo-field" id="todo-end-date-field">期限・終了日（任意）
            <input id="todo-end-date" type="date" />
          </label>
        </div>
        <label class="todo-field" id="todo-routine-period" hidden>期間
          <select id="todo-routine-period-select">
            <option value="daily">毎日</option>
            <option value="weekdays">平日</option>
            <option value="weekly">毎週</option>
            <option value="monthly">毎月</option>
          </select>
        </label>
        <details class="todo-advanced" id="todo-advanced">
          <summary>詳細設定</summary>
          <div class="todo-advanced-content">
            <div class="todo-field">
              <span>チェックボックス作成</span>
              <div id="todo-subtasks" class="todo-subtask-editor"></div>
              <button type="button" id="todo-add-subtask" class="lm-btn secondary">＋ 項目を追加</button>
            </div>
            <div class="todo-field" id="todo-linked-field">
              <span>紐付けタスクの選択（複数可）</span>
              <div id="todo-linked-list" class="todo-linked-list"></div>
              <label>表示方法
                <select id="todo-link-mode">
                  <option value="all">すべて表示</option>
                  <option value="sequence">順次表示</option>
                  <option value="custom">カスタム表示</option>
                </select>
              </label>
              <p class="todo-help">カスタム表示では、同時に表示するタスクに同じグループ番号を設定します。</p>
            </div>
            <div class="todo-field">
              <span>リンク（複数可）</span>
              <div id="todo-links" class="todo-link-editor"></div>
              <button type="button" id="todo-add-link" class="lm-btn secondary">＋ リンクを追加</button>
            </div>
            <section class="todo-field todo-notification-settings" aria-label="個別通知">
              <span>個別通知</span>
              <fieldset>
                <legend>定期通知（毎週）</legend>
                <span class="todo-notification-label">曜日</span>
                <div id="todo-weekly-days" class="todo-notification-options"></div>
                <span class="todo-notification-label">時刻</span>
                <div id="todo-weekly-times" class="todo-notification-options"></div>
              </fieldset>
              <fieldset>
                <legend>カスタム通知</legend>
                <div class="todo-custom-notification-add">
                  <input id="todo-custom-date" type="date" aria-label="通知日" />
                  <input id="todo-custom-time" type="time" aria-label="通知時刻" />
                  <button type="button" id="todo-add-custom-notification" class="lm-btn secondary">追加</button>
                </div>
                <ul id="todo-custom-notifications" class="todo-custom-notification-list"></ul>
              </fieldset>
            </section>
          </div>
        </details>
        <div class="todo-form-actions">
          <button type="submit" class="lm-btn" id="todo-save-button">タスクを追加</button>
          <button type="button" class="lm-btn secondary" id="todo-cancel-edit">閉じる</button>
        </div>
        </form>
      </dialog>
    </div>
  </section>


  <div id="nav-container"></div>
</div>

<script src="./js/core/app.js"></script>
<script src="./js/ui/navigation.js"></script>
<script src="./js/pages/todo.js"></script>

</body>
</html>
