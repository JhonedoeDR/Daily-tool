<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>イベント</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#faf8f3" />
</head>
<body>
  <div class="lm-page">
    <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
    <h1 class="lm-date-header">イベント</h1>
    <p class="lm-sub-header">期間・目標・現在値を登録すると、進捗を自動計算します</p>

    <section class="lm-section" style="border-top:none;">
      <div class="lm-section-title">開催中のイベント</div>
      <div id="ongoing-list"></div>
    </section>

    <section class="lm-section">
      <div class="lm-section-title" id="form-title">イベントを登録</div>
      <form id="event-form">
        <div class="lm-field">
          <label for="f-name">イベント名</label>
          <input id="f-name" required />
        </div>
        <div class="lm-field">
          <label for="f-start">開始日</label>
          <input id="f-start" type="date" required />
        </div>
        <div class="lm-field">
          <label for="f-end">終了日</label>
          <input id="f-end" type="date" required />
        </div>
        <div class="lm-field">
          <label for="f-target">目標値</label>
          <input id="f-target" type="number" inputmode="numeric" pattern="[0-9]*" min="0" required />
        </div>
        <div class="lm-field">
          <label for="f-current">現在値</label>
          <input id="f-current" type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="0" />
        </div>
        <div class="lm-field">
          <label for="f-unit">単位</label>
          <input id="f-unit" placeholder="例:pt、個" />
        </div>
        <div style="display:flex; gap:8px;">
          <button type="submit" class="lm-btn">保存</button>
          <button type="button" id="cancel-edit" class="lm-btn secondary" style="display:none;">キャンセル</button>
        </div>
      </form>
    </section>

    <section class="lm-section">
      <div class="lm-section-title">終了したイベント</div>
      <div id="ended-list"></div>
    </section>

    <div id="nav-container"></div>
  </div>

  <script src="./app.js"></script>
  <script src="./renderNav-menu.js"></script>
  <script src="./event.js"></script>
</body>
</html>
