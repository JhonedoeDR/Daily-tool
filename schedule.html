<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>予定・逆算</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#faf8f3" />
</head>
<body>
  <div class="lm-page">
    <a class="lm-back-link" href="./index.html">← 今日のページに戻る</a>
    <h1 class="lm-date-header">予定・逆算</h1>

    <section class="lm-section" style="border-top:none;" aria-label="カレンダー">
      <div class="hs-calendar-nav">
        <button type="button" class="lm-btn secondary" id="schedule-calendar-prev" aria-label="前の月">‹</button>
        <strong id="schedule-calendar-title"></strong>
        <button type="button" class="lm-btn secondary" id="schedule-calendar-next" aria-label="次の月">›</button>
      </div>
      <div class="hs-calendar-grid" id="schedule-calendar-grid" aria-label="月間カレンダー"></div>
      <div class="hs-calendar-controls sc-calendar-controls">
        <button type="button" class="lm-btn secondary" id="schedule-calendar-today">今日</button>
      </div>
    </section>

    <p class="lm-sub-header" id="form-title">予定を登録(<span id="step-indicator">1</span>/3)</p>
    <button type="button" id="cancel-edit" class="lm-btn secondary" style="display:none; margin-bottom:12px;">編集をキャンセル</button>
    <section class="lm-section">
      <form id="schedule-form">
        <!-- 1段階目 -->
        <div class="lm-step" data-step="1">
          <div class="lm-field">
            <label for="f-name">予定名</label>
            <input id="f-name" required />
          </div>
          <div class="lm-field">
            <label for="f-date">日付</label>
            <input id="f-date" type="date" required />
          </div>
          <div class="lm-field">
            <label for="f-start">開始時刻</label>
            <input id="f-start" type="time" required />
          </div>
          <div style="display:flex; gap:8px;">
            <button type="button" class="lm-btn" data-next="2">次へ</button>
          </div>
        </div>

        <!-- 2段階目 -->
        <div class="lm-step" data-step="2" style="display:none;">
          <div class="lm-field">
            <label for="f-place">場所</label>
            <input id="f-place" />
          </div>
          <div class="lm-field">
            <label for="f-travel">移動時間(分)</label>
            <input id="f-travel" type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="0" />
          </div>
          <div class="lm-field">
            <label for="f-prep">準備時間(分)</label>
            <input id="f-prep" type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="0" />
          </div>
          <div class="lm-field">
            <label for="f-arrive">何分前に到着したいか</label>
            <input id="f-arrive" type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="0" />
          </div>
          <div id="calc-preview" class="lm-empty"></div>
          <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
            <button type="button" class="lm-btn secondary" data-back="1">戻る</button>
            <button type="button" class="lm-btn secondary" data-skip-save="1">スキップして保存</button>
            <button type="button" class="lm-btn" data-next="3">次へ</button>
          </div>
        </div>

        <!-- 3段階目(任意) -->
        <div class="lm-step" data-step="3" style="display:none;">
          <div class="lm-field">
            <label>持ちものセット(任意・複数選択可)</label>
            <div id="f-belonging-list" class="lm-check-list"></div>
          </div>
          <div class="lm-field">
            <label for="f-memo">メモ(任意)</label>
            <textarea id="f-memo" rows="2"></textarea>
          </div>
          <div style="display:flex; gap:8px;">
            <button type="button" class="lm-btn secondary" data-back="2">戻る</button>
            <button type="submit" class="lm-btn">保存</button>
          </div>
        </div>
      </form>
    </section>

    <section class="lm-section">
      <div class="lm-section-title">登録済みの予定</div>
      <div class="lm-schedule-filters" role="group" aria-label="予定の分類">
        <button type="button" class="lm-btn secondary is-active" data-schedule-filter="all" aria-pressed="true">すべて</button>
        <button type="button" class="lm-btn secondary" data-schedule-filter="school" aria-pressed="false">学校</button>
        <button type="button" class="lm-btn secondary" data-schedule-filter="work" aria-pressed="false">バイト</button>
        <button type="button" class="lm-btn secondary" data-schedule-filter="other" aria-pressed="false">その他(手入力)</button>
      </div>
      <div id="schedule-list"></div>
    </section>

    <div id="nav-container"></div>
  </div>

  <script src="./app.js"></script>
  <script src="./renderNav-menu.js"></script>
  <script type="module" src="./firebase-sync.js"></script>
  <script src="./schedule.js"></script>
</body>
</html>
